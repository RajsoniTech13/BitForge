<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitForge Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/web3@1.7.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.66.0/dist/index.iife.min.js"></script>
    <script src="MyWallet.js"></script>
    <script src="popup.js" defer></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #1a2526 0%, #0a1214 100%);
            color: #e6ecec;
            min-width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 122, 204, 0.3);
        }

        h2, h3 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #007acc;
            text-shadow: 0 0 10px rgba(0, 122, 204, 0.7);
        }

        label {
            font-size: 14px;
            color: #99b3cc;
        }

        select, input, button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
            background: rgba(26, 37, 38, 0.8);
            color: #fff;
            transition: all 0.3s ease;
        }

        select:hover, input:hover, button:hover {
            background: rgba(26, 37, 38, 1);
            box-shadow: 0 0 15px rgba(0, 122, 204, 0.5);
        }

        button {
            background: linear-gradient(45deg, #005f99, #007acc);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 122, 204, 0.8);
        }

        button:active {
            transform: scale(0.95);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: rgba(26, 37, 38, 0.5);
            border-radius: 5px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid rgba(0, 122, 204, 0.2);
        }

        th {
            background: linear-gradient(90deg, #005f99, #007acc);
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
        }

        td {
            font-size: 12px;
            color: #e6ecec;
            word-break: break-all;
        }

        .select-btn, .delete-btn {
            padding: 5px 10px;
            margin: 0 5px;
            font-size: 10px;
            border-radius: 3px;
        }

        .select-btn {
            background: linear-gradient(45deg, #007acc, #00aaff);
        }

        .delete-btn {
            background: linear-gradient(45deg, #cc2900, #ff3300);
        }

        .select-btn:hover, .delete-btn:hover {
            transform: scale(1.1);
        }

        p {
            font-size: 14px;
            margin: 5px 0;
            color: #99b3cc;
        }

        #statusMessage {
            text-align: center;
            font-weight: bold;
            color: #ff9900;
            text-shadow: 0 0 5px rgba(255, 153, 0, 0.5);
        }

        #sendTransaction {
            display: none;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(0, 122, 204, 0.5); }
            50% { box-shadow: 0 0 20px rgba(0, 122, 204, 1); }
            100% { box-shadow: 0 0 5px rgba(0, 122, 204, 0.5); }
        }

        button:hover, .select-btn:hover, .delete-btn:hover {
            animation: glow 1.5s infinite;
        }
    </style>
</head>
<body>
    <h2>Crypto Wallet</h2>
    
    <label for="blockchain">Select Blockchain:</label>
    <select id="blockchain">
        <option value="ethereum">Ethereum</option>
        <option value="solana">Solana</option>
    </select>

    <button id="createWallet">Create Wallet</button>
    
    <h3>Your Wallets</h3>
    <table id="walletList">
        <thead>
            <tr>
                <th>ID</th>
                <th>Address</th>
                <th>Balance</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h3>Connect Wallet</h3>
    <input type="text" id="walletId" placeholder="Enter Wallet ID">
    <input type="password" id="privateKey" placeholder="Enter Private Key">
    <button id="connectWallet">Connect Wallet</button>

    <h3>Send Transaction</h3>
    <input type="text" id="sendToAddress" placeholder="Recipient Address">
    <input type="number" id="sendAmount" placeholder="Amount" step="0.1">
    <button id="sendTransaction">Send Transaction</button>

    <h3>Wallet Details</h3>
    <p id="walletAddress">Wallet Address: Not connected</p>
    <p id="walletBalance">Balance: Not available</p>
    <p id="privateKeyDisplay">Private Key: Not generated yet (save this securely after creation)</p>
    <p id="statusMessage"></p>
</body>
</html>
